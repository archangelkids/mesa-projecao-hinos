<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projeção de hinos</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}main{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;padding:5vh 5vw}#text{white-space:pre-wrap;text-align:center;line-height:1.3;overflow-wrap:anywhere;width:100%;max-width:100%}footer{position:fixed;bottom:2vh;left:5vw;right:5vw;text-align:center;font-size:clamp(12px,1.6vw,22px);color:#b8b8b8}#pix{position:fixed;right:4vw;bottom:7vh;width:18vw;max-width:320px;min-width:120px;padding:12px;background:#fff;color:#17221a;text-align:center;border-radius:10px;font-size:clamp(12px,1.3vw,18px);display:flex;flex-direction:column;gap:7px;align-items:center}#pix img{display:block;width:100%;aspect-ratio:1;object-fit:contain}button{position:fixed;top:10px;right:10px;background:#222;color:white;border:1px solid #666;padding:12px;opacity:0}button:hover,button:focus{opacity:1}#hint{position:fixed;top:15px;left:15px;color:#aaa;font-size:12px;animation:hide 1s 6s forwards}@keyframes hide{to{opacity:0;visibility:hidden}}</style></head><body><main><div id="text"></div></main><footer id="meta"></footer><div id="hint">Arraste esta janela para o projetor. F11: tela cheia. B: tela preta.</div><button id="full">Tela cheia</button><script src="projection.js"></script></body></html>
