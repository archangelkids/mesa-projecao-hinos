<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projeção de hinos</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}main{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;padding:5vh 5vw}#text{white-space:pre-wrap;text-align:center;line-height:1.3;overflow-wrap:anywhere;width:100%;max-width:100%}.dual{display:grid;grid-template-columns:1fr 1fr;gap:5vw;width:100%;align-items:start}.dual[hidden]{display:none!important}.dual .col{white-space:pre-wrap;line-height:1.3;font-size:clamp(24px,4.1vw,72px);font-weight:500}.dual .male{text-align:left;color:#9ec9ff}.dual .female{text-align:right;color:#f5a6d0}.dual h2{text-align:center;font-size:clamp(20px,3vw,52px);margin:0 0 2vh;letter-spacing:.04em}.dual .male h2{color:#9ec9ff}.dual .female h2{color:#f5a6d0}footer{position:fixed;bottom:2vh;left:5vw;right:5vw;text-align:center;font-size:clamp(12px,1.6vw,22px);color:#b8b8b8}#pix{position:fixed;right:4vw;bottom:7vh;width:18vw;max-width:320px;min-width:120px;padding:12px;background:#fff;color:#17221a;text-align:center;border-radius:10px;font-size:clamp(12px,1.3vw,18px);display:flex;flex-direction:column;gap:7px;align-items:center}#pix img{display:block;width:100%;aspect-ratio:1;object-fit:contain}button{position:fixed;top:10px;right:10px;background:#222;color:white;border:1px solid #666;padding:12px;opacity:0}button:hover,button:focus{opacity:1}#hint{position:fixed;top:15px;left:15px;color:#aaa;font-size:12px;animation:hide 1s 6s forwards}@keyframes hide{to{opacity:0;visibility:hidden}}</style></head><body><main><div id="text"></div><div id="dual" class="dual" hidden><div class="col male"><h2>HOMENS</h2><div class="body"></div></div><div class="col female"><h2>MULHERES</h2><div class="body"></div></div></div></main><footer id="meta"></footer><div id="hint">Arraste esta janela para o projetor. F11: tela cheia. B: tela preta.</div><button id="full">Tela cheia</button><script src="projection.js"></script></body></html>
